<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Desert Bike Racer</title><style>*{box-sizing:border-box}body{margin:0;background:#10101c;color:white;font-family:system-ui,Arial;display:flex;flex-direction:column;align-items:center;min-height:100dvh;overflow:hidden}header{padding:10px;font-weight:800;letter-spacing:1px}#wrap{position:relative;width:min(100vw,480px,calc((100dvh - 145px)*.72));aspect-ratio: 3/4;max-height:calc(100dvh - 145px)}canvas{display:block;width:100%;height:100%;border:3px solid #49405c;border-radius:12px;touch-action:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080717a8;border-radius:12px;text-align:center;padding:25px}#overlay.hidden{display:none}.card{background:#171529ee;border:1px solid #f2a65a;padding:25px 18px;border-radius:20px;box-shadow:0 12px 30px #0007}h1{margin:0 0 10px;color:#ffcf75;font-size:26px}p{line-height:1.7}button{background:#ffb648;border:0;color:#261a17;border-radius:12px;padding:13px 27px;font-size:19px;font-weight:800;cursor:pointer}#controls{display:flex;gap:40px;justify-content:center;margin-top:8px;direction:ltr}.ctrl{width:90px;height:52px;touch-action:none;user-select:none;font-size:25px;padding:4px;background:#3d3552;color:white;border:1px solid #8d7d9c}small{color:#c5bdc9;margin-top:5px}</style></head><body><header>🏍️ DESERT BIKE RACER 🏜️</header><div id="wrap"><canvas id="game" width="480" height="640" aria-label="Desert motorcycle racing game"></canvas><div id="overlay"><div class="card"><h1 id="title">سباق الصحراء</h1><p id="message">تجنب السيارات واجمع النقاط!<br>التحكم بالأسهم أو أزرار الشاشة.</p><button id="start">ابدأ اللعب ▶</button></div></div></div><div id="controls"><button class="ctrl" id="left" aria-label="يسار">◀</button><button class="ctrl" id="right" aria-label="يمين">▶</button></div><small>الكمبيوتر: ← → أو A / D | الجوال: الأزرار أو لمس الشاشة</small><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message');const W=480,H=640,horizon=205;let state='menu',score=0,speed=105,player=0,dir=0,objects=[],spawn=0,last=0,roadOffset=0,record=0;
try{record=Number(localStorage.getItem('desertBikeBest')||0)}catch(e){}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function start(){state='playing';score=0;speed=105;player=0;dir=0;objects=[];spawn=0;roadOffset=0;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',start);
const keys={};document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&state!=='playing')start()});document.addEventListener('keyup',e=>keys[e.key]=false);
for(const [id,value] of [['left',-1],['right',1]]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);dir=value});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>{if(dir===value)dir=0})}
canvas.addEventListener('pointerdown',e=>{if(state==='playing'){const r=canvas.getBoundingClientRect();dir=(e.clientX-r.left)<r.width/2?-1:1}});canvas.addEventListener('pointerup',()=>dir=0);canvas.addEventListener('pointercancel',()=>dir=0);
function road(z){let t=clamp(z,0,1);return {y:horizon+Math.pow(t,1.58)*(H-horizon),half:30+Math.pow(t,1.18)*195}}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function drawScene(){let sky=ctx.createLinearGradient(0,0,0,horizon+80);sky.addColorStop(0,'#30215a');sky.addColorStop(.48,'#a95273');sky.addColorStop(1,'#ffbb6c');rect(0,0,W,H,sky);ctx.fillStyle='#ffe6a0';ctx.beginPath();ctx.arc(240,179,48,Math.PI,0);ctx.fill();poly([[0,195],[45,155],[95,192],[155,148],[210,200],[280,154],[348,195],[411,158],[480,190],[480,235],[0,235]],'#8d5471');poly([[0,210],[65,183],[115,211],[170,181],[238,215],[307,181],[370,210],[440,185],[480,205],[480,270],[0,270]],'#bb775d');rect(0,horizon,W,H-horizon,'#e9a95f');for(let i=0;i<13;i++){let z=((i/13+roadOffset*.0003)%1),p=road(z),s=3+z*25;for(let side of [-1,1]){let x=240+side*(p.half+28+z*randFixed(i,side)*95);cactus(x,p.y,s)}}poly([[210,horizon],[270,horizon],[W,H],[0,H]],'#5d5354');poly([[210,horizon],[216,horizon],[12,H],[0,H]],'#ffecbf');poly([[264,horizon],[270,horizon],[480,H],[468,H]],'#ffecbf');poly([[217,horizon],[220,horizon],[18,H],[12,H]],'#d84e45');poly([[260,horizon],[263,horizon],[468,H],[462,H]],'#d84e45');for(let i=0;i<12;i++){let z=((i/12+roadOffset*.00075)%1),p=road(z),s=1+z*17;rect(240-s*.16,p.y,s*.32,Math.max(2,s*2.6),'#fff4c7')}
ctx.fillStyle='#1c1433dd';ctx.fillRect(10,10,137,57);ctx.fillRect(333,10,137,57);ctx.font='bold 15px system-ui';ctx.fillStyle='#f7e0b8';ctx.fillText('SCORE',22,28);ctx.fillText('SPEED',347,28);ctx.font='bold 25px system-ui';ctx.fillStyle='#ffda62';ctx.fillText(Math.floor(score),22,56);ctx.fillStyle='#7bff9a';ctx.fillText(Math.floor(speed),347,56)}
function randFixed(i,side){let n=Math.sin(i*23.4+side*73.7)*43758.5453;return n-Math.floor(n)}
function cactus(x,y,s){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#328451';ctx.lineWidth=Math.max(2,s*.18);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*1.7);ctx.moveTo(0,-s*.65);ctx.lineTo(-s*.45,-s*.65);ctx.lineTo(-s*.45,-s*1.13);ctx.moveTo(0,-s*1.02);ctx.lineTo(s*.48,-s*1.02);ctx.lineTo(s*.48,-s*1.48);ctx.stroke();ctx.restore()}
function car(x,y,s,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rect(-19,-15,38,30,'#22202b');rect(-16,-34,32,36,color);poly([[-12,-29],[12,-29],[16,-16],[-16,-16]],'#8fd6e0');rect(-20,-8,7,12,'#17151c');rect(13,-8,7,12,'#17151c');rect(-14,-3,9,5,'#ff5451');rect(5,-3,9,5,'#ff5451');ctx.restore()}
function bike(){const x=240+player*145,y=H-75;ctx.save();ctx.translate(x,y);ctx.fillStyle='#18141c';ctx.beginPath();ctx.ellipse(0,28,15,26,0,0,Math.PI*2);ctx.fill();rect(-15,-20,30,37,'#f05e2c');poly([[-23,-14],[-9,-24],[9,-24],[23,-14],[16,-5],[-16,-5]],'#eeeeec');rect(-27,-10,9,16,'#15131d');rect(18,-10,9,16,'#15131d');poly([[-13,-33],[13,-33],[20,-9],[-20,-9]],'#2b2530');ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(0,-36,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e85d38';ctx.beginPath();ctx.arc(0,-36,10,0,Math.PI*2);ctx.fill();rect(-6,10,12,7,'#fbc66a');ctx.restore()}
function update(dt){const steer=(keys.ArrowLeft||keys.a||keys.A?-1:0)+(keys.ArrowRight||keys.d||keys.D?1:0)+dir;player=clamp(player+clamp(steer,-1,1)*dt*1.65,-1.34,1.34);score+=dt*speed*.11;speed=Math.min(245,105+score*.12);roadOffset+=dt*speed;spawn-=dt;if(spawn<=0){objects.push({lane:rand(-.92,.92),z:0,color:['#e94d3b','#3b9cc1','#d4b64b','#895ac7'][Math.floor(Math.random()*4)]});spawn=rand(.75,1.4)*125/speed}for(const o of objects){o.z+=dt*speed/175;if(o.z>.83&&o.z<1.12&&Math.abs(o.lane-player)<.28){gameOver();return}}objects=objects.filter(o=>o.z<1.2)}
function gameOver(){state='over';record=Math.max(record,Math.floor(score));try{localStorage.setItem('desertBikeBest',record)}catch(e){}title.textContent='💥 انتهت اللعبة';message.innerHTML=`نقاطك: <b>${Math.floor(score)}</b><br>أفضل نتيجة: <b>${record}</b>`;document.getElementById('start').textContent='إعادة اللعب ↻';overlay.classList.remove('hidden')}
function render(){drawScene();objects.sort((a,b)=>a.z-b.z);for(const o of objects){let p=road(o.z),x=240+o.lane*p.half*.74;car(x,p.y,Math.max(.1,o.z*1.9),o.color)}bike()}
function loop(now){if(state!=='playing')return;let dt=Math.min((now-last)/1000,.04);last=now;update(dt);render();if(state==='playing')requestAnimationFrame(loop)}render();
</script></body></html>
