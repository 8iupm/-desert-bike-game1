<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101321"><title>Desert Bike Racer 2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101321;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}main{width:min(100%,520px);margin:auto;padding:10px 10px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}h1{font-size:19px;margin:0;letter-spacing:.5px}button{font:inherit;cursor:pointer;touch-action:none}button:focus-visible{outline:3px solid #ffce6e}.small{border:1px solid #66658a;background:#25263e;color:white;border-radius:12px;padding:8px 11px}.board{position:relative;border:3px solid #61528e;border-radius:18px;overflow:hidden;box-shadow:0 12px 45px #0007;background:#bd785c}canvas{display:block;width:100%;height:auto;aspect-ratio:3/5;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:5px;pointer-events:none;direction:ltr}.badge{background:#11172cba;border:1px solid #ffffff24;border-radius:10px;padding:6px 9px;min-width:75px;text-align:center;backdrop-filter:blur(5px)}.badge small{display:block;color:#e8d9bf;font-size:10px}.badge strong{font-size:20px;color:#ffcc73}.overlay{position:absolute;inset:0;background:#0a0c1db8;display:flex;align-items:center;justify-content:center;padding:18px}.overlay[hidden]{display:none}.modal{width:min(100%,360px);background:#181b30f5;border:2px solid #ffbb62;border-radius:22px;text-align:center;padding:23px 18px;box-shadow:0 20px 50px #0008}.modal h2{font-size:27px;color:#ffca77;margin:0 0 10px}.modal p{line-height:1.8;margin:7px 0 15px}.primary{background:#ffb847;color:#201526;border:0;border-radius:15px;font-weight:900;font-size:21px;padding:13px 30px;min-width:190px}.controls{display:flex;justify-content:center;gap:24px;margin-top:12px;direction:ltr}.control{width:110px;height:65px;border-radius:17px;background:#383452;border:1px solid #a498c6;color:#fff;font-size:32px;user-select:none;-webkit-user-select:none}.control:active{background:#7d679a}.tip{text-align:center;font-size:12px;color:#c7bfd0;margin:10px 0}.footer{text-align:center;font-size:12px;color:#aaa5bc}#sound{min-width:48px}@media(max-width:380px){h1{font-size:16px}.badge{min-width:64px;padding:5px}.badge strong{font-size:17px}}
</style></head><body><main><header><button id="sound" class="small" aria-label="تبديل الصوت">🔊</button><h1>🏍️ DESERT BIKE RACER 2 🌵</h1><button id="pause" class="small" aria-label="إيقاف مؤقت">⏸</button></header><div class="board"><canvas id="game" width="480" height="800" aria-label="لعبة سباق الدراجات"></canvas><div class="hud"><div class="badge"><small>SCORE</small><strong id="score">0</strong></div><div class="badge"><small>LEVEL</small><strong id="level">1</strong></div><div class="badge"><small>SPEED</small><strong id="speed">0</strong></div></div><div class="overlay" id="overlay"><div class="modal"><h2 id="title">سباق الصحراء 2 🏆</h2><p id="message">تجنب السيارات، اجمع العملات، وحقق أعلى نتيجة!<br>تحكم بالأسهم أو أزرار الشاشة.</p><p id="best">أفضل نتيجة: 0</p><button id="start" class="primary">▶ ابدأ اللعب</button></div></div></div><div class="controls"><button id="left" class="control" aria-label="يسار">◀</button><button id="right" class="control" aria-label="يمين">▶</button></div><p class="tip">الجوال: الأزرار أو لمس جانبي الطريق | الكمبيوتر: ← → أو A / D | المسافة: إيقاف مؤقت</p><p class="footer">تعمل مباشرة على GitHub Pages — بدون تثبيت</p></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=480,H=800;let state='menu',score=0,level=1,speed=0,elapsed=0,spawn=0,coinSpawn=0,roadTick=0,shake=0,last=0,player=0,entities=[],particles=[],keys={left:false,right:false},muted=false,audio=null,best=0;try{best=Number(localStorage.getItem('desertBikeBest2')||0)}catch(e){}$('best').textContent='أفضل نتيجة: '+best;function beep(freq=440,dur=.12,type='sine',vol=.08){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.6),audio.currentTime+dur);v.gain.setValueAtTime(vol,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function overlay(title,msg,btn){$('title').textContent=title;$('message').innerHTML=msg;$('start').textContent=btn;$('best').textContent='أفضل نتيجة: '+best;$('overlay').hidden=false}function start(){state='playing';score=0;level=1;speed=100;elapsed=0;spawn=0;coinSpawn=0;roadTick=0;player=0;entities=[];particles=[];shake=0;$('overlay').hidden=true;$('pause').textContent='⏸';beep(550,.12)}function pause(){if(state==='playing'){state='paused';overlay('متوقف مؤقتًا ⏸','اضغط متابعة للعودة إلى السباق','▶ متابعة');$('pause').textContent='▶'}else if(state==='paused')resume()}function resume(){state='playing';$('overlay').hidden=true;$('pause').textContent='⏸';last=performance.now()}function end(){state='over';shake=16;beep(130,.55,'sawtooth',.16);score=Math.floor(score);if(score>best){best=score;try{localStorage.setItem('desertBikeBest2',String(best))}catch(e){}}overlay('انتهى السباق 💥','نتيجتك: <b>'+score+'</b><br>وصلت إلى المستوى '+level,'↻ العب مجددًا')}$('start').onclick=()=>state==='paused'?resume():start();$('pause').onclick=pause;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};function bind(id,key){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}bind('left','left');bind('right','right');document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.code==='Space'&&!e.repeat){if(state==='playing'||state==='paused')pause();else start()}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;keys[x<.5?'left':'right']=true});for(let ev of ['pointerup','pointercancel','pointerleave'])c.addEventListener(ev,()=>{keys.left=false;keys.right=false});function polygon(points,color){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fill()}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function roadWidth(z){return 54+z*365}function yPos(z){return 260+z*z*535}function xPos(lane,z){return W/2+lane*roadWidth(z)*.33}function scene(dt){let sky=g.createLinearGradient(0,0,0,310);sky.addColorStop(0,'#312b60');sky.addColorStop(.6,'#b65d74');sky.addColorStop(1,'#f6b66b');rect(0,0,W,H,sky);g.fillStyle='#ffdf93';g.beginPath();g.arc(240,260,64,0,Math.PI*2);g.fill();polygon([[0,275],[48,212],[110,269],[170,207],[245,277],[310,219],[385,278],[440,230],[480,264],[480,330],[0,330]],'#87526e');polygon([[0,302],[90,258],[151,306],[246,265],[335,312],[415,263],[480,298],[480,350],[0,350]],'#b87467');rect(0,310,W,H-310,'#e9a85d');let rw=roadWidth(1),top=roadWidth(0);polygon([[240-top/2,260],[240+top/2,260],[240+rw/2,800],[240-rw/2,800]],'#f5e1b0');polygon([[240-top/2+5,260],[240+top/2-5,260],[240+rw/2-10,800],[240-rw/2+10,800]],'#bd554c');polygon([[240-top/2+10,260],[240+top/2-10,260],[240+rw/2-16,800],[240-rw/2+16,800]],'#57505a');for(let i=0;i<13;i++){let z=((i/13+roadTick)%1);if(z<.06)continue;let y=yPos(z),h=3+z*31,w=1+z*5;rect(240-w/2,y,w,h,'#ffe9ad')}for(let side of [-1,1])for(let i=0;i<12;i++){let z=((i/12+roadTick*.55)%1),y=yPos(z),x=240+side*(roadWidth(z)/2+23+z*40);cactus(x,y,Math.max(2,z*1.2+1),z)}}function cactus(x,y,s,z){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle='#39835a';g.lineWidth=2.8;g.lineCap='round';g.beginPath();g.moveTo(0,0);g.lineTo(0,-21);g.moveTo(0,-9);g.lineTo(-8,-9);g.lineTo(-8,-17);g.moveTo(0,-14);g.lineTo(7,-14);g.lineTo(7,-21);g.stroke();g.restore()}function vehicle(e){let z=e.z,y=yPos(z),x=xPos(e.lane,z),s=.24+z*1.22;g.save();g.translate(x,y);g.scale(s,s);if(e.type==='coin'){g.fillStyle='#ffdf56';g.beginPath();g.ellipse(0,-18,17,22,0,0,Math.PI*2);g.fill();g.strokeStyle='#f28d27';g.lineWidth=5;g.stroke();g.fillStyle='#aa6b13';g.font='bold 21px sans-serif';g.textAlign='center';g.fillText('★',0,-11)}else{rect(-31,-7,62,13,'#24202b');rect(-30,-72,60,68,e.color);polygon([[-23,-68],[23,-68],[28,-41],[-28,-41]],'#9ad4dc');rect(-35,-48,9,23,'#17151c');rect(26,-48,9,23,'#17151c');rect(-25,-16,14,8,'#ffdc74');rect(11,-16,14,8,'#ffdc74');rect(-30,-75,60,7,'#f3c1a1')}g.restore()}function bike(){let x=240+player*113,y=700;g.save();g.translate(x,y);g.fillStyle='#15131e';g.beginPath();g.ellipse(0,35,17,42,0,0,Math.PI*2);g.fill();rect(-30,-24,60,16,'#171623');rect(-34,-31,12,23,'#23202b');rect(22,-31,12,23,'#23202b');polygon([[-27,-12],[27,-12],[23,28],[-23,28]],'#e65e3c');rect(-14,2,28,18,'#ffbd61');polygon([[-30,-30],[0,-56],[30,-30],[20,-6],[-20,-6]],'#292b3c');g.fillStyle='#fff3dc';g.beginPath();g.arc(0,-51,23,0,Math.PI*2);g.fill();g.fillStyle='#e85a35';g.beginPath();g.arc(0,-52,17,0,Math.PI*2);g.fill();rect(-10,-74,20,5,'#d4d5db');g.restore()}function update(dt){if(state!=='playing')return;elapsed+=dt;level=1+Math.floor(elapsed/22);speed=Math.min(225,100+elapsed*2.1);score+=dt*(10+level*2);roadTick=(roadTick+dt*(.34+speed/300))%1;let move=(keys.right?1:0)-(keys.left?1:0);player=Math.max(-1.06,Math.min(1.06,player+move*dt*1.65));spawn-=dt;coinSpawn-=dt;if(spawn<=0){let lane=[-1,0,1][Math.floor(Math.random()*3)];entities.push({type:'car',lane,z:0,color:['#e65345','#4d9cda','#e7b847','#8a65c6'][Math.floor(Math.random()*4)]});spawn=Math.max(.48,1.55-level*.07)}if(coinSpawn<=0){entities.push({type:'coin',lane:[-1,0,1][Math.floor(Math.random()*3)],z:0});coinSpawn=1.5+Math.random()*1.2}for(let e of entities){e.z+=dt*(.23+speed/370);if(!e.hit&&e.z>.85&&e.z<1.02&&Math.abs(player-e.lane)<.42){e.hit=true;if(e.type==='car'){end();return}else{score+=100;beep(820,.12,'triangle');for(let i=0;i<8;i++)particles.push({x:xPos(e.lane,.9),y:690,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.45})}}}entities=entities.filter(e=>e.z<1.14&&!e.hit);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);$('score').textContent=Math.floor(score);$('level').textContent=level;$('speed').textContent=Math.floor(speed)}function render(dt){g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*55)}scene(dt);entities.sort((a,b)=>a.z-b.z).forEach(vehicle);bike();for(let p of particles){g.globalAlpha=Math.max(0,p.t/.45);g.fillStyle='#ffe17a';g.beginPath();g.arc(p.x,p.y,5,0,Math.PI*2);g.fill()}g.restore()}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()})})();
</script></body></html>
